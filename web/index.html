<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title">GPA Manager</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Skip to main content</a>
  <header class="top">
    <h1 data-i18n="title">GPA Manager</h1>
    <nav>
      <button type="button" id="btn-ops" data-i18n="nav.ops">Recent activity</button>
      <button type="button" id="btn-settings" data-i18n="nav.settings">Settings</button>
      <button type="button" id="btn-lang" class="lang" aria-label="Language">中文</button>
    </nav>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <main id="main">
    <section class="toolbar">
      <label class="target">
        <span data-i18n="target.label">Switch where</span>
        <select id="target"></select>
      </label>
      <p id="target-note" class="note"></p>
      <p id="conn" class="conn" data-i18n="conn.connecting">Connecting…</p>
    </section>
    <section class="accounts-head">
      <h2 data-i18n="accounts.title">Your accounts</h2>
      <button type="button" id="btn-add" class="primary" data-i18n="accounts.add">＋ Add account</button>
    </section>
    <div id="empty" class="empty" hidden>
      <p data-i18n="empty.text">No saved accounts yet. Import existing logins or add a new account.</p>
      <button type="button" id="btn-import" data-i18n="empty.import">Import existing accounts</button>
    </div>
    <ul id="accounts" class="list"></ul>
    <p id="result" class="result" hidden></p>
  </main>

  <dialog id="dlg-confirm">
    <h2 id="confirm-title" data-i18n="confirm.title">Restart and switch</h2>
    <p id="confirm-body"></p>
    <menu>
      <button type="button" id="confirm-ok" class="primary" data-i18n="confirm.ok">Restart and switch</button>
      <button type="button" id="confirm-cancel" value="cancel" data-i18n="common.cancel">Cancel</button>
    </menu>
  </dialog>
  <dialog id="dlg-wait">
    <h2 data-i18n="wait.title">Action needed first</h2>
    <p id="wait-body"></p>
    <menu>
      <button type="button" id="wait-retry" class="primary" data-i18n="wait.retry">I closed it, retry</button>
      <button type="button" id="wait-later" data-i18n="wait.later">Later</button>
    </menu>
  </dialog>
  <dialog id="dlg-add">
    <h2 data-i18n="add.title">Add account</h2>
    <label><span data-i18n="add.name">Label</span> <input id="add-name" data-i18n-placeholder="add.placeholder" placeholder="e.g. Work account"></label>
    <p id="add-status" class="note"></p>
    <p id="add-code" class="code" hidden></p>
    <menu>
      <button type="button" id="add-start" class="primary" data-i18n="add.start">Start sign-in</button>
      <button type="button" id="add-open" hidden data-i18n="add.open">Open sign-in page</button>
      <button type="button" id="add-copy" hidden data-i18n="add.copy">Copy device code</button>
      <button type="button" id="add-cancel" data-i18n="common.cancel">Cancel</button>
    </menu>
  </dialog>
  <dialog id="dlg-detail">
    <h2 id="detail-title" data-i18n="detail.title">Account details</h2>
    <div id="detail-body"></div>
    <menu>
      <button type="button" id="detail-close" data-i18n="common.close">Close</button>
    </menu>
  </dialog>
  <dialog id="dlg-ops">
    <h2 data-i18n="nav.ops">Recent activity</h2>
    <ul id="ops-list" class="ops"></ul>
    <menu><button type="button" id="ops-close" data-i18n="common.close">Close</button></menu>
  </dialog>
  <dialog id="dlg-settings">
    <h2 data-i18n="nav.settings">Settings</h2>
    <p id="settings-body" class="note"></p>
    <menu>
      <button type="button" id="settings-import" data-i18n="empty.import">Import existing accounts</button>
      <button type="button" id="settings-archived" data-i18n="settings.archived">Archived accounts</button>
      <button type="button" id="settings-diag" data-i18n="settings.diag">Diagnostics</button>
      <button type="button" id="settings-close" data-i18n="common.close">Close</button>
    </menu>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
